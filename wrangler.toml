name = "alesanabriav-site"
main = "worker.js"
compatibility_date = "2026-07-22"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "alesanabriav.com", custom_domain = true },
  { pattern = "www.alesanabriav.com", custom_domain = true },
  { pattern = "alesanabriav.com/*", zone_name = "alesanabriav.com" },
  { pattern = "alejandrosanabria.com/*", zone_name = "alejandrosanabria.com" },
  { pattern = "www.alejandrosanabria.com", custom_domain = true },
  { pattern = "www.alejandrosanabria.com/*", zone_name = "alejandrosanabria.com" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[build]
command = "pnpm build"
